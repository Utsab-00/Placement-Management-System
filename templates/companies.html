{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: #007bff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-left: 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            max-width: 700px;
            margin: 40px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .success-message {
            display: none;
            color: green;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">Placement System</div>
    <ul>
        <li><a href="{% url 'login' %}">Login</a></li>
        <li><a href="{% url 'admin_list' %}">Admin</a></li>
        <li><a href="{% url 'student_list' %}">Student</a></li>
        <li><a href="{% url 'home' %}">Home</a></li>
    </ul>
</nav>

<div class="container">
    <h2>Company Registration Form</h2>
    {% if messages %}
    {% for message in messages %}
        <p style="color: green;" id="message"> Form submitted successfully! ✅</p>
    {% endfor %}
    {% endif %}
    <div class="success-message" id="successMessage">
        Form submitted successfully! ✅
    </div>

    <form id="companyForm" method="post"class="form-control" action="{% url 'company_list' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="companyName">Company Name:</label>
            <input type="text" id="company_name" name="company_name" required>
        </div>

        <div class="form-group">
            <label for="website">Website:</label>
            <input type="url" id="company_website" name="company_website">
        </div>

        <div class="form-group">
            <label for="industry">Industry Type:</label>
            <input type="text" id="industry" name="industry">
        </div>

        <div class="form-group">
            <label for="address">Head Office Address:</label>
            <textarea id="company_address" rows="2" name="company_address"></textarea>
        </div>

        <div class="form-group">
            <label for="contactName">Contact Person Name:</label>
            <input type="text" id="contact_name"  name="contact_name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="company_email" name="company_email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="company_phone" name="company_phone">
        </div>

        <div class="form-group">
            <label for="jobProfiles">Job Profiles Offered:</label>
            <textarea id="job_profiles" rows="2" name="job_profiles"></textarea>
        </div>

        <div class="form-group">
            <label for="location">Locations of Posting:</label>
            <input type="text" id="location" name="location">
        </div>

        <div class="form-group">
            <label for="eligibility">Eligibility Criteria:</label>
            <textarea id="eligibility" rows="2" name="eligibility"></textarea>
        </div>

        <div class="form-group">
            <label for="selectionProcess">Selection Process:</label>
            <textarea id="selection_process" rows="2" name="selection_process"></textarea>
        </div>

        <div class="form-group">
            <label for="ctc">CTC Offered:</label>
            <input type="text" id="ctc" name="ctc" placeholder="e.g., 5 LPA">
        </div>

        <div class="form-group">
            <label for="internship">Internship Offered:</label>
            <select id="internship" name="internship">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div class="form-group">
            <label for="otherInfo">Other Information:</label>
            <textarea id="other_info" name="other_info" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label for="password">password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Submit</button>
    </form>

</div>

</body>
</html>
