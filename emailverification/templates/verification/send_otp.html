<!DOCTYPE html>
<html>
<head>
    <title>Send OTP</title>
</head>
<body>
    <h2>Email Verification</h2>
    {{error}}
    <form action="{% url 'send_otp' %}" method="post">
        {% csrf_token %}
        <label for="email">Enter your email:</label>
        <input type="email" name="email" required>
        <button type="submit">Send OTP</button>
    </form>
</body>
</html>
